<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="jennifer rivera" />
    <meta name="description" content="Spots" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img alt="spot logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <h2 class="profile__title"></h2>
          <div class="profile__avatar-container">
            <img
              class="profile__avatar"
              alt="Bessie Colman"
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Bessie_Coleman_%28cropped%29.jpg/640px-Bessie_Coleman_%28cropped%29.jpg"
            />
            <button type="button" class="profile__avatar-edit-btn">
              <img class="profile__edit-icon" alt="Edit Avatar" />
            </button>
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Colman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img class="profile__edit-img" alt="edit button" />
              Edit Profile
            </button>
          </div>

          <button type="button" class="profile__new-post-btn">
            <img alt="add button" class="profile__add-img" />
            New Post
          </button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button type="button" class="card__delete-btn"></button>
                <img alt="placeholder image" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__copyright">2023 © Spots</p>
      </footer>

      <!-- DELETE CARD MODAL -->
      <div class="modal" id="delete-card-modal">
        <div class="modal__container">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_delete"
          ></button>
          <h2 class="modal__title">
            Are you sure you want to delete this image?
          </h2>
          <form name="delete-card" class="modal__form">
            <div class="modal__button-row">
              <button type="submit" class="modal__submit-btn">Delete</button>
              <button type="button" class="modal__cancel-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- EDIT PROFILE MODAL  -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit profile</h2>
          <form name="edit-profile" class="modal__form">
            <!-- NAME FIELD -->
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Who are you? Drop your name here!"
                required
                minlength="2"
                maxlength="40"
              />
              <span
                class="modal__input-error"
                id="profile-name-input-error"
              ></span>
            </label>
            <!-- DESCRIPTION FIELD -->
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Tell us about yourself!"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                class="modal__input-error"
                id="profile-description-input-error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <!-- EDIT AVATAR MODAL -->
      <div class="modal" id="edit-avatar-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit profile avatar</h2>
          <form name="edit-avatar" class="modal__form" id="edit-avatar-form">
            <label for="avatar-link-input" class="modal__label">
              Profile Picture
              <input
                id="avatar-link-input"
                type="url"
                class="modal__input"
                placeholder="Paste an image link!"
                required
              />
              <span
                class="modal__input-error"
                id="avatar-link-input-error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <!-- NEW POST MODAL-->
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">New post</h2>

          <form name="newPost" class="modal__form" id="addCardFormEl">
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Place your Photo Link here!"
                required
              />
              <span
                class="modal__input-error"
                id="card-image-input-error"
              ></span>
            </label>

            <label for="photo-caption" class="modal__label">
              Caption
              <input
                id="photo-caption"
                type="text"
                class="modal__input"
                placeholder="Add Caption!"
                required
                minlength="2"
                maxlength="60"
              />
              <span class="modal__input-error" id="photo-caption-error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </div>

    <!-- IMAGE PREVIEW MODAL -->
    <div class="modal modal_type_preview" id="image-preview-modal">
      <div class="modal__preview-container">
        <button
          aria-label="close modal"
          class="modal__close-btn modal__close-btn_type_preview"
          type="button"
        ></button>
        <img alt="Golden Gate Bridge" class="modal__image" />
        <p class="modal__caption">Golden Gate Bridge</p>
      </div>
    </div>
  </body>
</html>
